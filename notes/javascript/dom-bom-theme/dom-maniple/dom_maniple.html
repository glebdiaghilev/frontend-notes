<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="dom_maniple.js" defer></script>
</head>
<body>
    <!-- create, check, replace, add elements -->
    <div class="box">
        just text
        <p class="paragraph-1">first paragraph</p>
        <p class="paragraph-2">second paragraph</p>
        <p class="paragraph-3">third paragraph</p>
    </div>
    
    <!-- features of createElement -->
    <div class="box-1">
        <p class="paragraphOne">paragraph 1</p>
    </div>

    <div class="box-2">
        <p class="paragraphTwo">paragraph 2</p>
    </div>

    <div class="box-3">
        <p class="paragraphThree">paragraph 3</p>
    </div>
    
    <div class="box-4">
        <p class="paragraphFour">paragraph 4</p>
    </div>

    <div class="box-5">
        <p class="paragraphFive">paragraph 5</p>
    </div>

    <!-- remove, clone move elements -->
    <div class="first-box">
        <p class="first-paragraph">paragraph 1</p>
    </div>

    <div class="second-box">
        <p class="second-paragraph">paragraph 2</p>
    </div>

    <div class="third-box">
        <p class="third-paragraph">paragraph 3</p>
    </div>
</body>
</html>
