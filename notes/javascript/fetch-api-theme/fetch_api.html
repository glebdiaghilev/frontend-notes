<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="fetch.api.css">
    <script src="fetch_api.js" defer></script>
</head>
<body>
    <main>
        <h1>client server</h1>
        <form class="create-post-form">
            <h2>create post</h2>
            <p>
                <label for="new-post-title">header post:</label>
                <input id="new-post-title" name="title">
            </p>
            <p>
                <label for="new-post-id">id post:</label>
                <input id="new-post-id" name="id" type="number">
            </p>
            <button type="submit">
                save post at server
            </button>
        </form>

        <form class="load-post-form">
            <h2>find post</h2>
            <p>
                <label for="post-id">id post:</label>
                <input type="number" id="post-id" value="1">
            </p>
            <button type="submit">
                download info from server
            </button>
        </form>

        <form class="search-posts-form">
            <h2>finding posts on views</h2>
            <p>
                <label for="post-views">minimum views:</label>
                <input type="number" id="post-views" value="0">
            </p>
            <button type="submit">
                find posts 
            </button>
        </form>

        <div class="result"></div>
    </main>
</body>
</html>
